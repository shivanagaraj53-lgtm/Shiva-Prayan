# Build and verify Prayan.
#
# Three jobs, in order of how much they need from you:
#
#   verify   — analyzer and every test. Needs nothing. Runs on every push.
#   android  — compiles a release bundle. Needs nothing to prove it builds;
#              signs it only when the upload-key secrets exist.
#   ios      — compiles the iOS app on macOS with --no-codesign, which needs
#              no Apple account, no certificate and no provisioning profile.
#
# The point of the last two is that "it compiles for the platform" stops being
# an assumption. Neither can be checked on a Linux workstation: the Android SDK
# and Xcode are not there. Until this runs, nobody has ever built this app for
# a phone.
#
# When the developer accounts exist, add the secrets listed under each job and
# the same workflow starts producing uploadable artifacts. Nothing else changes.

name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        # Formatting is not a test failure, but an unformatted diff makes every
        # later review noisier, so it is reported rather than enforced.
        run: dart format --output=none --set-exit-if-changed . || echo "::warning::dart format would change files"

      - name: Domain tests
        working-directory: packages/prayan_core
        run: dart test

      - name: App tests
        run: flutter test

      - name: Launcher icons are current
        # The icons are generated from the brand mark. If someone changed the
        # mark and did not regenerate, the app ships an icon that no longer
        # matches it — the drift test catches the constants, this catches the
        # pixels.
        run: |
          dart run tool/generate_launcher_icons.dart
          if ! git diff --quiet -- android/app/src/main/res ios/Runner/Assets.xcassets store/play web/icons web/favicon.png; then
            echo "::error::Launcher icons are stale. Run: dart run tool/generate_launcher_icons.dart"
            git diff --stat -- android/app/src/main/res ios/Runner/Assets.xcassets store/play web/icons web/favicon.png
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: shivanagaraj53-lgtm/Shiva-PrayanAI
          ref: ${{ github.ref_name }}
          path: backend
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        working-directory: backend
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::Backend repository not checked out; skipping."
            exit 0
          fi
          npm ci
          npm test

  android:
    name: Android release bundle
    runs-on: ubuntu-latest
    needs: verify
    env:
      # The `secrets` context cannot be used in a step-level `if`, but job-level
      # `env` can read it and `env` is available there.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Most of what the Android build downloads never changes between runs.
      # Caching it is the real fix for dependency-resolution flakiness: the
      # fewer requests to Maven Central, the less often it answers 429.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Secrets to add once the Play account exists:
      #   ANDROID_KEYSTORE_BASE64  — base64 of your upload .jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_PASSWORD
      #   ANDROID_KEY_ALIAS
      #
      #   base64 -w0 ~/prayan-upload.jks    # produces the first one
      #
      # Without them the build still runs and still proves the app compiles;
      # the bundle is simply unsigned and cannot be uploaded. It never falls
      # back to the debug key, which Play rejects at upload anyway.
      - name: Restore the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          PROPS

      - name: Build app bundle
        # Gradle resolves plugins from Maven Central on a cold cache, and that
        # host rate-limits shared CI ranges — the first run here died on a 429
        # before compiling anything. Flutter's own retry waits 100ms, which a
        # rate limit outlasts every time.
        #
        # So: retry, but only for failures that are actually transient. A
        # genuine compile error fails on the first attempt rather than being
        # tried three times and reported three minutes late.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter build appbundle --release 2>&1 | tee /tmp/gradle-build.log; then
              exit 0
            fi
            if grep -qiE "Too Many Requests|Could not GET|Could not resolve|Connection reset|Read timed out|502 Bad Gateway|503 Service" /tmp/gradle-build.log; then
              wait=$((attempt * 60))
              echo "::warning::Dependency download failed (attempt $attempt). Retrying in ${wait}s."
              sleep "$wait"
            else
              echo "::error::Build failed for a reason that will not fix itself. Not retrying."
              exit 1
            fi
          done
          echo "::error::Dependency downloads still failing after 3 attempts."
          exit 1

      - name: Report signing state
        run: |
          if [ -f android/key.properties ]; then
            echo "::notice::Signed with the upload key — this bundle can be uploaded to Play."
          else
            echo "::warning::No upload key secrets set, so this bundle is UNSIGNED and cannot be uploaded. It proves the app compiles."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS build
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign needs no Apple Developer account, no certificate and no
      # provisioning profile. It cannot produce something uploadable, but it
      # does prove the iOS app compiles and links — which is the part that has
      # never been checked, because it cannot be checked off macOS.
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Report
        run: |
          echo "::notice::iOS app compiled. Producing an uploadable IPA additionally needs an Apple Developer account, a distribution certificate and a provisioning profile."

      # Once the Apple account exists, replace the step above with an archive
      # and export. The usual approach is apple-actions/import-codesign-certs
      # followed by:
      #
      #   flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      #
      # Secrets it needs: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
      # PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID.

  sideload:
    name: Installable APK (no developer account)
    runs-on: ubuntu-latest
    needs: verify
    # The `android` job above proves the app compiles and produces the bundle
    # Play wants. It deliberately refuses to sign with anything but a real
    # upload key, so what it emits cannot be installed on a phone.
    #
    # This job answers the other question — "can I hold it in my hand today?"
    # — by signing a normal release APK with a keystore generated here and
    # thrown away when the runner is reclaimed. That is enough for Android to
    # accept a sideloaded install, and it needs no Google account, no Play
    # Console and no $25.
    #
    # It is NOT a substitute for the upload key, and the two must never be
    # confused:
    #
    #   * This APK cannot be uploaded to Play. Play binds an app to the first
    #     key it sees, and this one ceases to exist the moment the job ends.
    #   * Every run signs with a different key, so a newer build will not
    #     install over an older one — Android rejects a signature change.
    #     Uninstall first. That is the cost of not committing a key, and it is
    #     the right trade for a build meant to be tried, not maintained.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate a throwaway signing key
        # Kept in RUNNER_TEMP, never in the workspace, so no path an artifact
        # upload or a stray `git add` could reach it through.
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/sideload.jks" \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -alias sideload \
            -storepass sideload -keypass sideload \
            -dname "CN=Prayan Sideload, OU=Testing, O=Prayan, C=IN"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/sideload.jks
          storePassword=sideload
          keyPassword=sideload
          keyAlias=sideload
          PROPS

      - name: Build the APK
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release 2>&1 | tee /tmp/apk-build.log; then
              exit 0
            fi
            if grep -qiE "Too Many Requests|Could not GET|Could not resolve|Connection reset|Read timed out|502 Bad Gateway|503 Service" /tmp/apk-build.log; then
              wait=$((attempt * 60))
              echo "::warning::Dependency download failed (attempt $attempt). Retrying in ${wait}s."
              sleep "$wait"
            else
              echo "::error::Build failed for a reason that will not fix itself. Not retrying."
              exit 1
            fi
          done
          exit 1

      - name: Confirm it is actually signed
        # An unsigned APK installs on nothing, and the failure shows up on the
        # phone rather than here unless it is checked here.
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "::notice::Signed with the throwaway sideload key. Installable on a phone; NOT uploadable to Play."
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: prayan-sideload-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
